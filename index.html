<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡El Hub Oficial del Grupo! 🔥🎉</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: background 0.5s ease;
    }

    /* Animación Modo Fiesta */
    .modo-fiesta-active {
      animation: lucesFiesta 0.6s infinite alternate;
    }

    @keyframes lucesFiesta {
      0% { background-color: #ff007f; }
      33% { background-color: #7928ca; }
      66% { background-color: #00dfd8; }
      100% { background-color: #ff4500; }
    }

    /* Tarjeta Neón */
    .card-fun {
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* Botón Escurridizo */
    #btnHuidizo {
      position: relative;
      transition: all 0.15s ease-out;
      z-index: 999;
    }

    .badge-fun {
      font-size: 0.9rem;
      border-radius: 20px;
    }

    /* Efecto de sacudida */
    .shake {
      animation: shakeAnim 0.3s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="container text-center" style="max-width: 600px;" id="mainContainer">
    <div class="card card-fun p-4 p-md-5 my-3">
      
      <!-- Encabezado con Emoji Animado -->
      <div class="display-1 mb-2" id="mainEmoji">👾</div>
      <h1 class="fw-black text-warning display-5 fw-bold mb-1">¡HOLA BANDA! 🔥</h1>
      <p class="text-light opacity-75 mb-4">El panel de control interactivo exclusivo para mis amigos favoritos.</p>

      <!-- SECCIÓN 1: LA RULETA DEL GRUPO -->
      <div class="bg-dark bg-opacity-50 p-4 rounded-4 mb-4 border border-secondary">
        <h5 class="text-info fw-bold mb-3">🎰 Ruleta de la Verdad</h5>
        <h3 class="fw-bold text-white mb-3" id="resultadoRuleta">¿Quién paga los tacos hoy? 👇</h3>
        <button class="btn btn-info btn-lg fw-bold rounded-pill text-dark px-4 shadow" onclick="girarRuleta()">
          🎲 Girar Ruleta
        </button>
      </div>

      <!-- SECCIÓN 2: GENERADOR DE APODOS -->
      <div class="bg-dark bg-opacity-50 p-3 rounded-4 mb-4 border border-secondary">
        <h6 class="text-warning fw-bold mb-2">🏷️ Generador de Apodos del Día</h6>
        <p class="fs-5 fw-semibold text-light mb-2" id="apodoTexto">Tu apodo hoy es: <span class="badge bg-warning text-dark">???</span></p>
        <button class="btn btn-outline-warning btn-sm rounded-pill px-3" onclick="generarApodo()">
          ✨ Descubrir mi Apodo
        </button>
      </div>

      <!-- BOTONES DE ACCIÓN LINDOS Y LOCOS -->
      <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mb-3">
        <!-- Botón Modo Fiesta -->
        <button class="btn btn-danger btn-lg fw-bold rounded-pill px-4" onclick="toggleModoFiesta()">
          🪩 MODO FIESTA
        </button>

        <!-- Botón Lanza Amor -->
        <button class="btn btn-success btn-lg fw-bold rounded-pill px-4" onclick="lluviaDeAmor()">
          💖 Lluvia de Amor
        </button>
      </div>

      <!-- EL BOTÓN TROLL QUE SE ESCAPA -->
      <div class="mt-3">
        <button id="btnHuidizo" class="btn btn-outline-light btn-sm rounded-pill" onmouseover="huirBoton()" onclick="atrapado()">
          🚫 ¡Prohibido Clic! (No me vas a atrapar)
        </button>
      </div>

    </div>
  </div>

  <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Audio Context para generar efectos de sonido retro sin cargar archivos externos
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(tipo) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (tipo === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (tipo === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // 1. RULETA DE LA VERDAD
    const opcionesRuleta = [
      "🌮 Le toca pagar los tacos al que lee esto",
      "😴 Fany",
      "🕺 Micke",
      "💅 Mabe",
      "🎨 Dany",
      "🤠 Nudi",
      "👀 El/La más chismoso/a del grupo",
      "💔 El que le va más mal en el amor",
      "🍺 El que dice 'una y nos vamos' y se queda hasta el final",
      "🏈 El mas fife",
    ];

    function girarRuleta() {
      playSound('pop');
      const elem = document.getElementById("resultadoRuleta");
      elem.innerText = "GIRANDO... 🔄";
      
      let contador = 0;
      const intervalo = setInterval(() => {
        elem.innerText = opcionesRuleta[Math.floor(Math.random() * opcionesRuleta.length)];
        contador++;
        if (contador > 10) {
          clearInterval(intervalo);
          playSound('win');
          confetti({ particleCount: 50, spread: 60 });
        }
      }, 100);
    }

    // 2. GENERADOR DE APODOS
    const cosas = [
      "Capibara",
      "Michi",
      "Taco de Pastor",
      "NPC",
      "Chisme",
      "Sticker sin Fondo",
      "Audio de 3 Minutos",
      "PDF de la Tarea",
      "Batería en 1%",
      "Cuenta Secundaria",
      "Broster",
      "Notificación de TikTok",
      "Personaje Secundario"
    ];

    const adjetivos = [
      "Alucín 🏎️",
      "Basado/a 🔥",
      "Funado/a 🚫",
      "Lagueado/a 📶",
      "Aesthetic ✨",
      "Tryhard 🎯",
      "Cringe 😬",
      "Fantasma 👻",
      "Espectador/a 👀",
      "Desvelado/a 🌙",
      "Modo Pro 😎",
      "Tímido/a 🙈"
    ];

    function generarApodo() {
      playSound('pop');
      const adj = adjetivos[Math.floor(Math.random() * adjetivos.length)];
      const ani = cosas[Math.floor(Math.random() * cosas.length)];
      document.getElementById("apodoTexto").innerHTML = `Tu apodo hoy es: <span class="badge bg-warning text-dark fs-6">${ani} ${adj}</span>`;
    }

    // 3. MODO FIESTA
    let modoFiesta = false;
    function toggleModoFiesta() {
      playSound('win');
      modoFiesta = !modoFiesta;
      const body = document.body;
      const container = document.getElementById("mainContainer");
      
      if (modoFiesta) {
        body.classList.add("modo-fiesta-active");
        container.classList.add("shake");
        document.getElementById("mainEmoji").innerText = "🪩";
        
        // Ráfaga de confeti continuo
        let duracion = 3 * 1000;
        let fin = Date.now() + duracion;

        (function frame() {
          confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
          confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
          if (Date.now() < fin) requestAnimationFrame(frame);
        })();

        setTimeout(() => container.classList.remove("shake"), 300);
      } else {
        body.classList.remove("modo-fiesta-active");
        document.getElementById("mainEmoji").innerText = "👾";
      }
    }

    // 4. LLUVIA DE AMOR
    function lluviaDeAmor() {
      playSound('win');
      confetti({
        shapes: ['star'],
        colors: ['#ff758c', '#ff7eb3', '#ffffff'],
        particleCount: 100,
        spread: 100,
        origin: { y: 0.6 }
      });
      document.getElementById("mainEmoji").innerText = "💖";
    }

    // 5. BOTÓN TROLL ES CURRIDIZO
    function huirBoton() {
      playSound('pop');
      const btn = document.getElementById("btnHuidizo");
      const x = Math.random() * (window.innerWidth - 180);
      const y = Math.random() * (window.innerHeight - 60);
      
      btn.style.position = 'fixed';
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }

    function atrapado() {
      alert("¡No puede ser, me atrapaste! 🎉 Eres demasiado rápido.");
    }
  </script>
</body>
</html>
